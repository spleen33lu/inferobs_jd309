[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spleen33lu-inferobs_jd309"
version = "0.1.0"
description = "把候选项映射到类别上，算出模型服务可观测性工程师·多租户的显存隔离的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "spleen33lu" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://spleen33lu.github.io"
Repository = "https://github.com/spleen33lu/inferobs_jd309"
Issues = "https://github.com/spleen33lu/inferobs_jd309/issues"

[project.scripts]
inferobs_jd309 = "inferobs_jd309:main"

[tool.setuptools]
py-modules = ["inferobs_jd309"]
